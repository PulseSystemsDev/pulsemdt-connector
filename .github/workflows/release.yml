name: Package legacy connector

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the legacy resource under its required folder name
        run: |
          mkdir -p dist/pulsemdt
          cp -r client server nui config.example.lua fxmanifest.lua dist/pulsemdt/
          cp README.legacy.md dist/pulsemdt/README.md
          cd dist
          zip -r ../pulsemdt-connector.zip pulsemdt

      - name: Publish legacy release asset
        uses: softprops/action-gh-release@v2
        with:
          files: pulsemdt-connector.zip

