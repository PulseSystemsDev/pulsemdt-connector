name: Publish PulseMDT 2 game pack

on:
  push:
    branches: [main]
    paths:
      - "game-pack/pulse-game-pack.zip"
      - "game-pack/SHA256SUMS"
      - "game-pack/RELEASE_NOTES.md"
      - ".github/workflows/publish-game-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the built game pack
        run: |
          sha256sum -c game-pack/SHA256SUMS
          unzip -tqq game-pack/pulse-game-pack.zip
          unzip -Z1 game-pack/pulse-game-pack.zip | grep -Fx '[pulse]/pulsemdt/fxmanifest.lua'
          unzip -Z1 game-pack/pulse-game-pack.zip | grep -Fx '[pulse]/pulse.cfg'

      - name: Publish the current game pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 2.0.0 >/dev/null 2>&1; then
            gh release upload 2.0.0 game-pack/pulse-game-pack.zip --clobber
          else
            gh release create 2.0.0 game-pack/pulse-game-pack.zip \
              --title "PulseMDT 2.0 game pack" \
              --notes-file game-pack/RELEASE_NOTES.md \
              --target "$GITHUB_SHA" --latest
          fi

